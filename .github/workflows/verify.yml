name: Verify Herocon

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript source verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript checks
        run: npm run typecheck
      - name: Membership, trial and workspace checks
        run: node --experimental-strip-types --test tests/premium-trial.test.cjs tests/discovery-access.test.cjs tests/catalogue-access.test.cjs tests/sourcing-workspace.test.cjs
      - name: Business catalogue editorial tests
        run: node --test tests/business-catalogue-edit.test.cjs
      - name: Personal shop editorial tests
        run: node --test tests/personal-shop-edit.test.cjs
      - name: BuckyDrop integration and safety tests (mocked, no live orders)
        run: node --test tests/buckydrop-integration.test.cjs
      - name: Production BuckyDrop route smoke tests (no orders or paid lookups)
        run: node --test tests/buckydrop-live-smoke.test.cjs
