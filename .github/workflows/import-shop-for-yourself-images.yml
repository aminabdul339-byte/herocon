name: Import product photos from spreadsheet

on:
  push:
    branches: [feat/shop-for-yourself-photos-20261120]
    paths:
      - '.github/workflows/import-shop-for-yourself-images.yml'
      - 'scripts/import-shop-for-yourself-images.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    name: Import and commit row-matched photos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'requests==2.32.5'
      - name: Download spreadsheet and extract exact product photos
        run: python scripts/import-shop-for-yourself-images.py
      - name: Commit imported photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shop-for-yourself-images
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add 844 exact product photos from spreadsheet"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
